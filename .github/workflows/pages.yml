name: Build & Deploy MyST site to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install MyST
        run: |
          python -m pip install --upgrade pip
          pip install mystmd

      - name: Build HTML
        run: |
          BASE_URL="/${{ github.event.repository.name }}" myst build --html

      - name: Detect output directory
        run: |
          if [ -d "_build/html" ]; then
            echo "SITE_DIR=_build/html" >> $GITHUB_ENV
          elif [ -d "_site" ]; then
            echo "SITE_DIR=_site" >> $GITHUB_ENV
          else
            echo "No output directory found. Listing repo root:"
            ls -la
            echo "Listing _build (if exists):"
            ls -la _build || true
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
